name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    name: Proprietary material inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Proprietary set matches the documented inventory
        # This repository knowingly contains proprietary engine and voice files;
        # NOTICE.md enumerates them and explains the position. So this step does not
        # object to their presence. It fails when the *set* changes, which is the case
        # worth catching: a file added or removed without NOTICE.md being updated to
        # match. Keeping it red permanently would only teach us to ignore it.
        #
        # Note the leading '*' on the filename patterns. A git pathspec without a
        # wildcard anchors at the repository root, so a bare 'Ivx330nt.dll' silently
        # matches nothing when the file lives in a subdirectory.
        run: |
          set -euo pipefail
          patterns=(
            '*.ddb' '*.phm' '*.ivx'
            '*Ivx330nt.dll' '*Sx32w.dll' '*cryput.dll' '*darules.dll'
            '*VoiceDescriptions.txt'
          )
          for p in "${patterns[@]}"; do
            git ls-files -- "$p"
          done | sort -u > /tmp/current-inventory.txt

          echo "Proprietary files tracked: $(wc -l < /tmp/current-inventory.txt)"
          cat /tmp/current-inventory.txt

          if ! diff -u .github/proprietary-inventory.txt /tmp/current-inventory.txt; then
            echo "::error::The set of proprietary files in this repository has changed."
            echo "If that is intended, update NOTICE.md to describe it and regenerate"
            echo ".github/proprietary-inventory.txt. If it is not, remove the files."
            exit 1
          fi
          echo "OK - matches the inventory documented in NOTICE.md."

      - name: Fail if a built add-on is committed
        run: |
          set -euo pipefail
          found=$(git ls-files -- '*.nvda-addon')
          if [ -n "$found" ]; then
            echo "::error::built add-on committed: $found"
            echo "The built add-on belongs on the Releases page. See docs/RELEASING.md."
            exit 1
          fi
          echo "OK - no built add-on in the tree."

      - name: Fail if any file exceeds GitHub's 100 MB limit
        run: |
          set -euo pipefail
          big=$(git ls-files | while read -r f; do [ -f "$f" ] && find "$f" -size +100M; done)
          if [ -n "$big" ]; then
            echo "::error::files over 100 MB are committed:"
            echo "$big"
            exit 1
          fi
          echo "OK - no oversized files."

  python:
    name: Driver syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Byte-compile the driver
        # The driver imports NVDA-internal modules that only exist inside NVDA,
        # so it cannot be imported here. Compiling verifies syntax, which is the
        # failure mode that actually bites during development.
        run: python -m compileall -q addon/infovox330/synthDrivers addon/infovox330/synthDrivers32

      - name: Lint with ruff
        continue-on-error: true
        run: |
          pip install ruff
          ruff check addon --select E9,F63,F7,F82 --output-format github

  manifest:
    name: Add-on manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate manifest.ini
        run: |
          python - <<'PY'
          import configparser, sys, pathlib

          text = pathlib.Path("addon/infovox330/manifest.ini").read_text(encoding="utf-8")
          cp = configparser.ConfigParser()
          cp.read_string("[m]\n" + text)
          m = cp["m"]

          required = ["name", "summary", "description", "author", "version",
                      "minimumNVDAVersion", "lastTestedNVDAVersion"]
          missing = [k for k in required if not m.get(k, "").strip()]
          if missing:
              sys.exit(f"manifest.ini missing required keys: {', '.join(missing)}")

          if m["name"].strip() != "infovox330":
              sys.exit("manifest name must be 'infovox330' to match the driver name")

          for key in ("version", "minimumNVDAVersion", "lastTestedNVDAVersion"):
              v = m[key].strip()
              if not all(part.isdigit() for part in v.split(".")):
                  sys.exit(f"{key} is not a dotted numeric version: {v!r}")

          print("manifest.ini OK")
          for k in required + ["url"]:
              print(f"  {k} = {m.get(k, '').strip()}")
          PY
